
<style>
#erd { padding: 1rem 0; }
#erd svg { width: 100%; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#2a2d36' : '#f1efe8',
    primaryBorderColor: dark ? '#4a4e5a' : '#b4b2a9',
    primaryTextColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const diagram = `erDiagram
  users {
    uuid id PK
    text email
    user_role role
  }
  content_versions {
    uuid id PK
    entity_type entity_type
    uuid entity_id
    integer version
    jsonb snapshot
    uuid author_id FK
    timestamptz created_at
  }
  internal_comments {
    uuid id PK
    entity_type entity_type
    uuid entity_id
    uuid author_id FK
    text body
    boolean resolved
    timestamptz created_at
  }
  role_permissions {
    uuid id PK
    user_role role
    text permission
    timestamptz created_at
  }
  entity_relations {
    uuid id PK
    entity_type from_type
    uuid from_id
    entity_type to_type
    uuid to_id
    relation_kind kind
    integer weight
    jsonb metadata
    timestamptz created_at
  }
  seasons {
    uuid id PK
    text slug
    text title
    content_status status
    boolean featured
    date starts_at
    date ends_at
  }
  members {
    uuid id PK
    text name
    text email
    text role
    text[] commissions
    text visibility
  }
  taxonomy {
    uuid id PK
    taxonomy_kind kind
    text label
    text slug
    timestamptz created_at
  }
  ctas {
    uuid id PK
    text key
    text label
    text target
    text variant
    text visibility
  }
  cms_collections {
    uuid id PK
    text key
    text title
    entity_type entity_type
    jsonb filters
    text layout
  }
  cms_health_checks {
    uuid id PK
    text key
    text label
    text severity
    boolean enabled
  }

  users ||--o{ content_versions : "auteur"
  users ||--o{ internal_comments : "auteur"
  users ||--o{ role_permissions : "possede"

  entity_relations }o--|| seasons : "relie (from)"
  entity_relations }o--|| seasons : "relie (to)"
  entity_relations }o--|| members : "relie (from)"
  entity_relations }o--|| members : "relie (to)"
  entity_relations }o--|| cms_collections : "relie"
  entity_relations }o--|| ctas : "relie"

  cms_collections ||--o{ entity_relations : "filtre via"
  seasons ||--o{ content_versions : "versionnee"
  seasons ||--o{ internal_comments : "commentee"
  members ||--o{ content_versions : "versionnee"
  members ||--o{ internal_comments : "commentee"
  taxonomy }o--o{ entity_relations : "taggue"
`;
const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
